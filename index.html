<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>법학 쟁점노트</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
*{box-sizing:border-box}[hidden]{display:none!important} :root{--bg:#f6f4ef;--panel:#fff;--fg:#24231f;--muted:#817d73;--line:#dedbd2;--soft:#eeece5;--accent:#315fa8;--danger:#b43d32;--shadow:0 7px 24px rgba(40,36,27,.07)}
@media(prefers-color-scheme:dark){:root{--bg:#15171b;--panel:#1d2026;--fg:#ecebe6;--muted:#969a9f;--line:#333840;--soft:#282c33;--accent:#83aaf0;--danger:#ef8077;--shadow:none}}
html,body{height:100%;margin:0;overflow:hidden} body{background:var(--bg);color:var(--fg);font:15px/1.55 Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif}
button,input,textarea,select{font:inherit} button{color:inherit}
header{height:58px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 18px;background:var(--panel)}
.brand{font-size:17px;font-weight:750;white-space:nowrap}.count{font-size:12px;color:var(--muted);margin-right:auto}
.header-actions{display:flex;gap:6px}.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 11px;cursor:pointer}.btn:hover{background:var(--soft)}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.danger{color:var(--danger)}
.app{height:calc(100% - 58px);width:100%;min-height:0;overflow:hidden;display:grid;grid-template-columns:clamp(300px,30vw,420px) minmax(0,1fr)}
.sidebar{border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;background:var(--panel)}
.filters{padding:14px;border-bottom:1px solid var(--line)}.search-wrap{display:flex;gap:7px}.search{width:100%;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--fg);padding:9px 11px;outline:none}.search:focus,.field:focus,.body-field:focus{border-color:var(--accent)}
.folder-section{position:relative;border-bottom:1px solid var(--line);padding:9px 8px 11px;overflow:visible;flex:0 0 auto}.folder-head{display:flex;align-items:center;padding:0 5px 5px;color:var(--muted);font-size:12px;font-weight:700}.folder-head span{margin-right:auto}.mini-btn{border:0;background:transparent;color:var(--muted);border-radius:5px;padding:2px 6px;cursor:pointer}.mini-btn:hover{background:var(--soft);color:var(--fg)}
.list{min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:5px 8px 8px;flex:1 1 0}.card{display:block;width:100%;text-align:left;border:1px solid transparent;background:transparent;padding:11px;border-radius:10px;cursor:pointer;margin-bottom:3px}.card:hover{background:var(--soft)}.card.active{background:color-mix(in srgb,var(--accent) 10%,var(--panel));border-color:color-mix(in srgb,var(--accent) 32%,var(--line))}
.card-title{font-weight:700;display:flex;gap:7px;align-items:center}.star{color:#d29a00}.card-body{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}.type{font-size:11px;color:var(--muted);border:1px solid var(--line);padding:0 5px;border-radius:5px;font-weight:500}
.empty{color:var(--muted);text-align:center;padding:45px 20px}.editor{overflow:auto;padding:22px 24px 45vh}.editor-inner{width:100%;margin:0}.blank{height:100%;display:grid;place-items:center;color:var(--muted)}
.editor-top{display:flex;gap:8px;align-items:flex-start}.title-field{flex:1;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--fg);font-size:25px;font-weight:750;padding:5px 2px 9px;outline:none}
.icon-btn{border:1px solid var(--line);background:transparent;border-radius:8px;padding:7px 9px;cursor:pointer}.icon-btn:hover{background:var(--soft)}.icon-btn.on{color:#d29a00}
.meta-grid{display:grid;grid-template-columns:160px 1fr;gap:12px;margin:18px 0}.label{font-size:12px;color:var(--muted);display:block;margin-bottom:5px}.field{width:100%;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:8px;padding:8px 10px;outline:none}
.folder-field-wrap,.sidebar-folder-wrap{position:relative}.folder-picker-trigger{display:flex;align-items:center;justify-content:space-between;cursor:pointer;text-align:left}.folder-picker-trigger:hover{border-color:var(--accent)}.folder-picker{position:absolute;z-index:25;top:calc(100% + 5px);right:0;width:max(100%,340px);max-width:calc(100vw - 30px);max-height:min(440px,60vh);overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel);box-shadow:var(--shadow);padding:7px}.sidebar-folder-picker{left:0;right:auto;width:100%;max-height:min(520px,70vh)}.picker-row{display:flex;align-items:stretch;min-height:34px;border-radius:7px}.picker-row:hover{background:var(--soft)}.picker-row.selected{background:color-mix(in srgb,var(--accent) 11%,var(--panel));color:var(--accent);font-weight:650}.picker-guides{width:calc(var(--depth,0) * 18px);flex:0 0 auto;background:repeating-linear-gradient(to right,transparent 0 16px,var(--line) 16px 17px)}.picker-toggle,.picker-spacer{width:26px;flex:0 0 26px;border:0;background:transparent;color:var(--muted);padding:0;cursor:pointer}.picker-spacer{cursor:default}.picker-select{min-width:0;flex:1;border:0;background:transparent;color:inherit;text-align:left;padding:6px 8px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.picker-meta{font-size:11px;color:var(--muted);align-self:center;padding:0 5px}.picker-actions{display:flex;align-items:center;opacity:.35}.picker-row:hover .picker-actions,.picker-row:focus-within .picker-actions{opacity:1}.picker-actions button{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:3px 5px;border-radius:5px}.picker-actions button:hover{color:var(--fg);background:var(--panel)}.picker-unfiled{border-bottom:1px solid var(--line);margin-bottom:5px}
.tag-picker{position:relative;grid-column:1/-1}.chosen-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:7px}.chosen-tag{display:inline-flex;align-items:center;gap:4px;border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));background:color-mix(in srgb,var(--accent) 8%,var(--panel));color:var(--accent);border-radius:999px;padding:3px 7px 3px 9px;font-size:12px}.chosen-tag button{border:0;background:transparent;color:inherit;padding:0 2px;cursor:pointer;font-size:14px;line-height:1}.tag-suggestions{position:absolute;z-index:20;top:100%;left:0;right:0;margin-top:4px;max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:9px;background:var(--panel);box-shadow:var(--shadow);padding:5px}.tag-suggestions button{display:flex;width:100%;justify-content:space-between;border:0;background:transparent;color:var(--fg);padding:7px 9px;border-radius:6px;cursor:pointer;text-align:left}.tag-suggestions button:hover,.tag-suggestions button:focus{background:var(--soft)}.tag-count{color:var(--muted);font-size:12px}.create-tag{color:var(--accent)!important}
.body-editor{position:relative;width:100%;min-height:330px;border:1px solid var(--line);background:var(--panel);border-radius:11px;box-shadow:var(--shadow);overflow:hidden}.body-editor:focus-within{border-color:var(--accent)}.body-field,.body-highlights{margin:0;font:inherit;line-height:1.75;letter-spacing:inherit;tab-size:4;white-space:pre-wrap;overflow-wrap:break-word}.body-field{position:relative;z-index:1;display:block;width:100%;min-height:330px;resize:vertical;border:0;background:transparent;color:var(--fg);border-radius:10px;padding:16px;outline:none;box-shadow:none}.body-highlights{position:absolute;z-index:0;inset:0;overflow:hidden;padding:16px;color:transparent;pointer-events:none}.body-highlights mark{color:transparent;background:#ffe36e;border-radius:3px;box-decoration-break:clone;-webkit-box-decoration-break:clone}.body-help{display:block;margin-top:6px;color:var(--muted);font-size:12px}
@media(prefers-color-scheme:dark){.body-highlights mark{background:#7c6519}}
.save-state{height:22px;text-align:right;color:var(--muted);font-size:12px;margin-top:4px}.related{margin-top:28px;padding-top:18px;border-top:1px solid var(--line)}.related h3{font-size:14px;margin:0 0 10px}.related-list{display:flex;gap:7px;flex-wrap:wrap}.related button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 9px;cursor:pointer}.related button:hover{border-color:var(--accent)}
dialog{margin:auto;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:13px;padding:21px;width:min(92%,520px);box-shadow:var(--shadow)}dialog::backdrop{background:rgba(0,0,0,.45)}dialog h2{font-size:17px;margin:0 0 6px}dialog p{font-size:13px;color:var(--muted);margin:0 0 13px}.dialog-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}.sync-msg{min-height:21px;color:var(--accent);font-size:13px;margin-top:8px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}
.mobile-back{display:none}
@media(max-width:720px){header{height:54px;padding:0 12px}.app{height:calc(100% - 54px);display:block}.sidebar{height:100%;border:0}.editor{display:none;height:100%;padding:18px 15px 35vh}.app.editing .sidebar{display:none}.app.editing .editor{display:block}.mobile-back{display:inline-block}.meta-grid{grid-template-columns:1fr}.title-field{font-size:21px}.hide-mobile{display:none}.body-field{min-height:45vh}.header-actions .btn{padding:6px 8px}}
</style>
</head>
<body>
<header>
  <div class="brand">법학 쟁점노트</div>
  <div class="count" id="count"></div>
  <div class="header-actions">
    <button class="btn primary" id="newBtn">＋ 새 쟁점</button>
    <button class="btn hide-mobile" id="exportBtn">내보내기</button>
    <button class="btn hide-mobile" id="importBtn">가져오기</button>
    <button class="btn" id="syncBtn">동기화</button>
  </div>
</header>
<div class="app" id="app">
  <aside class="sidebar">
    <div class="filters">
      <div class="search-wrap"><input class="search" id="search" placeholder="제목, 본문, 태그 검색" autocomplete="off"></div>
    </div>
    <section class="folder-section">
      <div class="folder-head"><span>폴더</span><button class="mini-btn" id="addRootFolder" title="최상위 폴더 추가">＋</button></div>
      <div class="sidebar-folder-wrap">
        <button class="field folder-picker-trigger" id="sidebarFolderField" type="button" aria-expanded="false"><span id="sidebarFolderLabel">폴더 선택</span><span>▾</span></button>
        <div class="folder-picker sidebar-folder-picker" id="sidebarFolderPicker" hidden></div>
      </div>
    </section>
    <div class="list" id="list"></div>
  </aside>
  <main class="editor" id="editor">
    <div class="blank" id="blank">쟁점을 선택하거나 새로 만들어 주세요.</div>
    <div class="editor-inner" id="editorInner" hidden>
      <button class="btn mobile-back" id="backBtn">← 목록</button>
      <div class="editor-top">
        <input class="title-field" id="titleField" placeholder="쟁점 제목">
        <button class="icon-btn" id="starBtn" title="중요 표시">☆</button>
        <button class="icon-btn danger" id="deleteBtn" title="삭제">삭제</button>
      </div>
      <div class="meta-grid">
        <label><span class="label">유형</span><input class="field" id="typeField" list="types" placeholder="예: 쟁점, 학설, 판례"></label>
        <div class="folder-field-wrap" id="folderFieldWrap">
          <span class="label">폴더</span>
          <button class="field folder-picker-trigger" id="folderField" type="button" aria-expanded="false"><span id="folderFieldLabel">미분류</span><span>▾</span></button>
          <div class="folder-picker" id="folderPicker" hidden></div>
        </div>
        <div class="tag-picker" id="tagPicker">
          <span class="label">태그</span>
          <div class="chosen-tags" id="chosenTags"></div>
          <input class="field" id="tagsField" placeholder="태그 검색 또는 새 태그 입력 후 Enter" autocomplete="off">
          <div class="tag-suggestions" id="tagSuggestions" hidden></div>
        </div>
      </div>
      <label><span class="label">내용</span><div class="body-editor"><div class="body-highlights" id="bodyHighlights" aria-hidden="true"></div><textarea class="body-field" id="bodyField" placeholder="학설, 판례의 입장, 검토, 의문점 등을 자유롭게 적어 주세요." aria-describedby="bodyHelp"></textarea></div></label>
      <span class="body-help" id="bodyHelp">단어나 구문을 드래그한 뒤 우클릭 또는 Ctrl+H로 형광펜을 켜거나 끌 수 있습니다.</span>
      <div class="save-state" id="saveState"></div>
      <section class="related" id="related" hidden><h3>같은 태그의 관련 쟁점</h3><div class="related-list" id="relatedList"></div></section>
    </div>
  </main>
</div>
<datalist id="types"><option>쟁점</option><option>학설</option><option>판례</option><option>조문</option><option>요건</option><option>효과</option><option>결론</option><option>기타</option></datalist>
<input id="fileIn" type="file" accept=".json,application/json" hidden>
<dialog id="syncDlg">
  <h2>GitHub Gist 동기화</h2>
  <p>기존 설정을 그대로 쓸 수 있습니다. 토큰은 이 브라우저에만 저장됩니다. 비공개 자료에는 Gist 대신 JSON 백업을 권장합니다.</p>
  <label><span class="label">GitHub 토큰 (업로드할 때 필요)</span><input class="field" id="tokenIn" type="password" autocomplete="off" placeholder="github_pat_…"></label>
  <label><span class="label">Gist ID</span><input class="field" id="gistIn" autocomplete="off" placeholder="예: a1b2c3d4…"></label>
  <div class="sync-msg" id="syncMsg"></div>
  <div class="dialog-actions"><button class="btn" id="pullBtn">가져오기</button><button class="btn primary" id="pushBtn">업로드</button><button class="btn" id="closeSync">닫기</button></div>
</dialog>
<dialog id="folderDlg">
  <h2 id="folderDlgTitle">새 폴더</h2>
  <p id="folderDlgHint"></p>
  <label><span class="label">폴더 이름</span><input class="field" id="folderNameField" autocomplete="off" placeholder="예: 채권법"></label>
  <div class="sync-msg" id="folderMsg"></div>
  <div class="dialog-actions"><button class="btn" id="cancelFolder">취소</button><button class="btn primary" id="saveFolder">저장</button></div>
</dialog>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const LS_DOC='lawissues.doc',LS_OLD='lawtree.doc',LS_CFG='lawtree.cfg',GIST_FILE='lawtree.json';
const TYPE_MAP={plain:'일반',issue:'쟁점',req:'요건',effect:'효과',law:'조문',case:'판례',theory:'학설',concl:'결론'};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const now=()=>Date.now();
const cleanTags=value=>[...new Set((Array.isArray(value)?value:String(value||'').split(',')).map(v=>String(v).trim().replace(/^#/,'')).filter(Boolean))];
const cleanKeywords=value=>[...new Set((Array.isArray(value)?value:[]).map(v=>String(v).replace(/\s+/g,' ').trim()).filter(Boolean))];
function normalizeKeywordRanges(body,value){
  const ranges=(Array.isArray(value)?value:[]).map(r=>({start:Math.max(0,Math.min(body.length,Math.trunc(Number(r?.start)))),end:Math.max(0,Math.min(body.length,Math.trunc(Number(r?.end))))})).filter(r=>Number.isFinite(r.start)&&Number.isFinite(r.end)&&r.end>r.start).sort((a,b)=>a.start-b.start||a.end-b.end);
  const merged=[];for(const range of ranges){const last=merged.at(-1);if(last&&range.start<=last.end)last.end=Math.max(last.end,range.end);else merged.push({...range})}
  return merged.map(r=>({...r,text:body.slice(r.start,r.end)}));
}
function rangesFromLegacyKeywords(body,value){
  const ranges=[];for(const keyword of cleanKeywords(value)){let from=0,index;while((index=body.indexOf(keyword,from))!==-1){ranges.push({start:index,end:index+keyword.length});from=index+Math.max(1,keyword.length)}}return normalizeKeywordRanges(body,ranges);
}
function refreshKeywordData(item){item.keywordRanges=normalizeKeywordRanges(item.body,item.keywordRanges);item.keywords=[...new Set(item.keywordRanges.map(r=>r.text.replace(/\s+/g,' ').trim()).filter(Boolean))]}
const textOf=item=>[item.title,item.body,item.type,...item.tags,...(item.keywords||[])].join(' ').toLocaleLowerCase('ko');

function sampleDoc(){
  const civil=uid(),act=uid();
  return{version:4,title:'법학 쟁점노트',updatedAt:now(),folders:[
    {id:civil,name:'민법',parentId:null,createdAt:now()},
    {id:act,name:'법률행위',parentId:civil,createdAt:now()}
  ],items:[
    {id:uid(),title:'착오에 의한 의사표시',type:'쟁점',folderId:act,tags:['민법','의사표시','취소'],keywordRanges:[],body:'민법 제109조의 요건과 효과, 동기의 착오 및 중대한 과실 여부를 정리해 보세요.',star:false,createdAt:now(),updatedAt:now()},
    {id:uid(),title:'동기의 착오',type:'판례',folderId:act,tags:['민법','의사표시','착오'],keywordRanges:[{start:19,end:27,text:'법률행위의 내용'}],body:'판례는 동기가 상대방에게 표시되어 법률행위의 내용이 된 경우에 내용의 착오로서 취소할 수 있다고 본다.',star:false,createdAt:now(),updatedAt:now()}
  ]}
}
function normalizeItem(x){const body=String(x.body||''),keywordRanges=Array.isArray(x.keywordRanges)?normalizeKeywordRanges(body,x.keywordRanges):rangesFromLegacyKeywords(body,x.keywords);const item={id:String(x.id||uid()),title:String(x.title??x.text??''),type:String(x.type&&TYPE_MAP[x.type]||x.type||'쟁점'),folderId:x.folderId?String(x.folderId):null,tags:cleanTags(x.tags),keywordRanges,keywords:[],body,source:String(x.source||''),star:!!x.star,createdAt:+x.createdAt||now(),updatedAt:+x.updatedAt||now()};refreshKeywordData(item);return item}
function normalizeFolder(x){return{id:String(x.id||uid()),name:String(x.name||'새 폴더').trim()||'새 폴더',parentId:x.parentId?String(x.parentId):null,createdAt:+x.createdAt||now()}}
function ensureFolderPath(folders,names){
  let parentId=null;
  for(const raw of names){
    const name=String(raw).trim();if(!name)continue;
    let folder=folders.find(f=>f.parentId===parentId&&f.name===name);
    if(!folder){folder=normalizeFolder({name,parentId});folders.push(folder)}
    parentId=folder.id;
  }
  return parentId;
}
function normalizeDoc(d){
  const items=(Array.isArray(d.items)?d.items:[]).map(normalizeItem);
  const folders=(Array.isArray(d.folders)?d.folders:[]).map(normalizeFolder);
  if(!folders.length){
    for(const item of items){
      const prefix='기존 경로: ';
      if(item.source.startsWith(prefix))item.folderId=ensureFolderPath(folders,item.source.slice(prefix.length).split(' › '));
    }
  }
  const ids=new Set(folders.map(f=>f.id));
  for(const folder of folders)if(folder.parentId&&!ids.has(folder.parentId))folder.parentId=null;
  for(const item of items)if(item.folderId&&!ids.has(item.folderId))item.folderId=null;
  return{version:4,title:String(d.title||'법학 쟁점노트'),updatedAt:+d.updatedAt||now(),folders,items};
}
function migrateTree(d){
  const items=[],folders=[];
  function walk(nodes,parentId=null,path=[]){
    for(const n of nodes||[]){
      const title=String(n.text||'').trim(),body=String(n.body||'').trim();
      const next=title?[...path,title]:path;
      let folderId=parentId;
      if(title&&Array.isArray(n.children)&&n.children.length){
        const folder=normalizeFolder({id:'folder-'+String(n.id||uid()),name:title,parentId});
        folders.push(folder);folderId=folder.id;
      }
      if(title||body){
        const subject=path[0]&&path[0]!==title?path[0]:'';
        items.push(normalizeItem({id:n.id,title:title||'제목 없음',type:TYPE_MAP[n.type]||'일반',folderId,tags:subject?[subject]:[],body,source:path.length?'기존 경로: '+path.join(' › '):'',star:n.star,createdAt:d.updatedAt,updatedAt:d.updatedAt}));
      }
      walk(n.children,folderId,next);
    }
  }
  walk(d.tree);
  return{version:4,title:String(d.title||'법학 쟁점노트').replace('트리','쟁점'),updatedAt:+d.updatedAt||now(),folders,items};
}
function parseDoc(raw){
  const d=typeof raw==='string'?JSON.parse(raw):raw;
  if(d&&Array.isArray(d.items))return normalizeDoc(d);
  if(d&&Array.isArray(d.tree))return migrateTree(d);
  throw new Error('지원하지 않는 데이터 형식');
}
function loadDoc(){
  try{const saved=localStorage.getItem(LS_DOC);if(saved){const parsed=parseDoc(saved);localStorage.setItem(LS_DOC,JSON.stringify(parsed));return parsed}}catch(e){}
  try{const old=localStorage.getItem(LS_OLD);if(old){const migrated=parseDoc(old);localStorage.setItem(LS_DOC,JSON.stringify(migrated));return migrated}}catch(e){}
  return sampleDoc();
}
let doc=loadDoc(),selectedId=null,query='',tagPickerOpen=false,selectedView='all';
let cfg={};try{cfg=JSON.parse(localStorage.getItem(LS_CFG))||{}}catch(e){}
let saveTimer=null;
const app=$('#app'),listEl=$('#list'),countEl=$('#count');

function saveCfg(){localStorage.setItem(LS_CFG,JSON.stringify(cfg))}
function saveNow(){clearTimeout(saveTimer);saveTimer=null;doc.version=4;for(const item of doc.items)refreshKeywordData(item);doc.updatedAt=now();localStorage.setItem(LS_DOC,JSON.stringify(doc));$('#saveState').textContent='저장됨'}
function scheduleSave(){doc.updatedAt=now();$('#saveState').textContent='저장 중…';clearTimeout(saveTimer);saveTimer=setTimeout(saveNow,350)}
addEventListener('beforeunload',()=>{if(saveTimer)saveNow()});
function selected(){return doc.items.find(x=>x.id===selectedId)}
function allTags(){const counts={};for(const x of doc.items)for(const t of x.tags)counts[t]=(counts[t]||0)+1;return Object.entries(counts).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'ko'))}
function folderById(id){return doc.folders.find(f=>f.id===id)}
function folderChildren(parentId){return doc.folders.filter(f=>f.parentId===parentId).sort((a,b)=>a.name.localeCompare(b.name,'ko'))}
function descendantIds(id){
  const ids=new Set([id]),queue=[id];
  while(queue.length){const parent=queue.shift();for(const f of doc.folders)if(f.parentId===parent&&!ids.has(f.id)){ids.add(f.id);queue.push(f.id)}}
  return ids;
}
function itemsInView(view){
  if(view==='all')return doc.items;
  if(view==='recent')return doc.items.filter(x=>x.updatedAt>=now()-7*864e5);
  if(view==='starred')return doc.items.filter(x=>x.star);
  if(view==='unfiled')return doc.items.filter(x=>!x.folderId);
  const ids=descendantIds(view);return doc.items.filter(x=>x.folderId&&ids.has(x.folderId));
}
function viewName(view){
  if(view==='all')return'전체 쟁점';if(view==='recent')return'최근 수정';if(view==='starred')return'중요 쟁점';if(view==='unfiled')return'미분류';
  const names=[];let f=folderById(view),guard=0;while(f&&guard++<50){names.unshift(f.name);f=folderById(f.parentId)}return names.join(' › ')||'전체 쟁점';
}
function filtered(){
  const words=query.trim().toLocaleLowerCase('ko').split(/\s+/).filter(Boolean);
  const source=words.length?doc.items:itemsInView(selectedView);
  return source.filter(x=>words.every(w=>textOf(x).includes(w))).sort((a,b)=>Number(b.star)-Number(a.star)||b.updatedAt-a.updatedAt)
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const folderPickerExpanded=new Set(),sidebarFolderExpanded=new Set();
function expandFolderAncestors(id,expanded){let f=folderById(id),guard=0;while(f&&guard++<50){if(f.parentId)expanded.add(f.parentId);f=folderById(f.parentId)}}
function renderTreePicker(picker,{selectedFolderId,expanded,emptyLabel,onSelect,manage=false}){
  const visited=new Set();
  function rows(parentId,depth){
    return folderChildren(parentId).map(f=>{
      if(visited.has(f.id))return'';visited.add(f.id);
      const hasChildren=doc.folders.some(x=>x.parentId===f.id),open=expanded.has(f.id);
      const toggle=hasChildren?'<button class="picker-toggle" type="button" data-tree-toggle="'+esc(f.id)+'" title="'+(open?'접기':'펼치기')+'">'+(open?'▾':'▸')+'</button>':'<span class="picker-spacer"></span>';
      const meta=manage?'<span class="picker-meta">'+itemsInView(f.id).length+'</span><span class="picker-actions"><button type="button" data-folder-action="add" data-id="'+esc(f.id)+'" title="하위 폴더 추가">＋</button><button type="button" data-folder-action="rename" data-id="'+esc(f.id)+'" title="이름 변경">✎</button><button type="button" data-folder-action="delete" data-id="'+esc(f.id)+'" title="폴더 삭제">×</button></span>':'';
      return'<div class="picker-row '+(selectedFolderId===f.id?'selected':'')+'"><span class="picker-guides" style="--depth:'+depth+'"></span>'+toggle+'<button class="picker-select" type="button" data-tree-folder="'+esc(f.id)+'">'+esc(f.name)+'</button>'+meta+'</div>'+(open?rows(f.id,depth+1):'')
    }).join('');
  }
  picker.innerHTML='<div class="picker-row picker-unfiled '+(!selectedFolderId?'selected':'')+'"><span class="picker-spacer"></span><button class="picker-select" type="button" data-tree-folder="">'+esc(emptyLabel)+'</button></div>'+rows(null,0);
  picker.querySelectorAll('[data-tree-toggle]').forEach(b=>b.onclick=e=>{e.stopPropagation();const id=b.dataset.treeToggle;if(expanded.has(id))expanded.delete(id);else expanded.add(id);renderTreePicker(picker,{selectedFolderId,expanded,emptyLabel,onSelect,manage})});
  picker.querySelectorAll('[data-tree-folder]').forEach(b=>b.onclick=()=>onSelect(b.dataset.treeFolder||null));
  picker.querySelectorAll('[data-folder-action]').forEach(b=>b.onclick=e=>{e.stopPropagation();const id=b.dataset.id;if(b.dataset.folderAction==='add')addFolder(id);if(b.dataset.folderAction==='rename')renameFolder(id);if(b.dataset.folderAction==='delete')deleteFolder(id)});
}
function renderFolders(){
  const folder=folderById(selectedView),label=$('#sidebarFolderLabel');label.textContent=folder?viewName(folder.id):'폴더 선택';label.parentElement.title=folder?viewName(folder.id):'모든 폴더의 쟁점을 표시합니다.';
  if(!$('#sidebarFolderPicker').hidden)renderSidebarFolderPicker();
}
let folderDialogState=null;
function addFolder(parentId=null){
  folderDialogState={mode:'add',parentId};$('#folderDlgTitle').textContent=parentId?'하위 폴더 만들기':'새 폴더 만들기';$('#folderDlgHint').textContent=parentId?'위치: '+viewName(parentId):'최상위 폴더로 생성합니다.';$('#folderNameField').value='';$('#folderMsg').textContent='';$('#folderDlg').showModal();$('#folderNameField').focus();
}
function renameFolder(id){
  const folder=folderById(id);if(!folder)return;folderDialogState={mode:'rename',id,parentId:folder.parentId};$('#folderDlgTitle').textContent='폴더 이름 변경';$('#folderDlgHint').textContent='위치: '+(folder.parentId?viewName(folder.parentId):'최상위');$('#folderNameField').value=folder.name;$('#folderMsg').textContent='';$('#folderDlg').showModal();$('#folderNameField').select();
}
function saveFolderDialog(){
  if(!folderDialogState)return;const clean=$('#folderNameField').value.trim();if(!clean){$('#folderMsg').textContent='폴더 이름을 입력하세요.';return}
  const {mode,parentId,id}=folderDialogState;
  if(doc.folders.some(f=>f.id!==id&&f.parentId===parentId&&f.name===clean)){ $('#folderMsg').textContent='같은 위치에 동일한 폴더가 있습니다.';return }
  if(mode==='add'){const folder=normalizeFolder({name:clean,parentId});doc.folders.push(folder);selectedView=folder.id}
  else{const folder=folderById(id);if(folder)folder.name=clean}
  folderDialogState=null;$('#folderDlg').close();scheduleSave();render();
}
function deleteFolder(id){
  const folder=folderById(id);if(!folder||!confirm('“'+folder.name+'” 폴더만 삭제할까요?\n쟁점과 하위 폴더는 상위 폴더로 이동합니다.'))return;
  for(const item of doc.items)if(item.folderId===id)item.folderId=folder.parentId;
  for(const child of doc.folders)if(child.parentId===id)child.parentId=folder.parentId;
  doc.folders=doc.folders.filter(f=>f.id!==id);if(selectedView===id)selectedView=folder.parentId||'all';scheduleSave();render();toast('폴더만 삭제했습니다');
}
function renderFolderPicker(){
  const x=selected();if(!x)return;renderTreePicker($('#folderPicker'),{selectedFolderId:x.folderId,expanded:folderPickerExpanded,emptyLabel:'미분류',onSelect:chooseFolder});
}
function toggleFolderPicker(force){
  const picker=$('#folderPicker'),open=force===undefined?picker.hidden:force;
  if(open){const x=selected();if(!x)return;toggleSidebarFolderPicker(false);if(x.folderId)expandFolderAncestors(x.folderId,folderPickerExpanded);renderFolderPicker()}
  picker.hidden=!open;$('#folderField').setAttribute('aria-expanded',String(open));
}
function chooseFolder(folderId){
  const x=selected();if(!x)return;x.folderId=folderId;selectedView=folderId||'all';x.updatedAt=now();scheduleSave();toggleFolderPicker(false);render();
}
function renderSidebarFolderPicker(){renderTreePicker($('#sidebarFolderPicker'),{selectedFolderId:folderById(selectedView)?.id||null,expanded:sidebarFolderExpanded,emptyLabel:'폴더 선택 해제',onSelect:chooseSidebarFolder,manage:true})}
function toggleSidebarFolderPicker(force){
  const picker=$('#sidebarFolderPicker'),open=force===undefined?picker.hidden:force;
  if(open){toggleFolderPicker(false);if(folderById(selectedView))expandFolderAncestors(selectedView,sidebarFolderExpanded);renderSidebarFolderPicker()}
  picker.hidden=!open;$('#sidebarFolderField').setAttribute('aria-expanded',String(open));
}
function chooseSidebarFolder(folderId){selectedView=folderId||'all';query='';$('#search').value='';toggleSidebarFolderPicker(false);renderFolders();renderList()}
function renderList(){
  const items=filtered();countEl.textContent=query?items.length+'개 검색됨':doc.items.length+'개';
  listEl.innerHTML=items.length?items.map(x=>'<button class="card '+(x.id===selectedId?'active':'')+'" data-id="'+esc(x.id)+'"><div class="card-title">'+(x.star?'<span class="star">★</span>':'')+'<span>'+esc(x.title||'제목 없음')+'</span> '+(x.type?'<span class="type">'+esc(x.type)+'</span>':'')+'</div><div class="card-body">'+esc(x.body||'내용 없음')+'</div></button>').join(''):'<div class="empty">'+(query?'검색 결과가 없습니다.':'새 쟁점을 추가해 보세요.')+'</div>';
  listEl.querySelectorAll('.card').forEach(b=>b.onclick=()=>openItem(b.dataset.id));
}
function renderEditor(){
  const x=selected();$('#blank').hidden=!!x;$('#editorInner').hidden=!x;if(!x)return;
  $('#titleField').value=x.title;$('#typeField').value=x.type;$('#folderFieldLabel').textContent=x.folderId?viewName(x.folderId):'미분류';$('#folderPicker').hidden=true;$('#folderField').setAttribute('aria-expanded','false');$('#tagsField').value='';$('#bodyField').value=x.body;$('#starBtn').textContent=x.star?'★':'☆';$('#starBtn').classList.toggle('on',x.star);renderTagPicker();renderBodyHighlights();
  const related=doc.items.filter(y=>y.id!==x.id&&y.tags.some(t=>x.tags.includes(t))).map(y=>({y,score:y.tags.filter(t=>x.tags.includes(t)).length})).sort((a,b)=>b.score-a.score||b.y.updatedAt-a.y.updatedAt).slice(0,8);
  $('#related').hidden=!related.length;$('#relatedList').innerHTML=related.map(({y,score})=>'<button data-id="'+esc(y.id)+'">'+esc(y.title||'제목 없음')+' <span class="type">'+score+'개 태그</span></button>').join('');
  $('#relatedList').querySelectorAll('button').forEach(b=>b.onclick=()=>openItem(b.dataset.id));
}
function render(){renderFolders();renderList();renderEditor()}
function openItem(id){selectedId=id;const x=selected();if(x&&!query&&!itemsInView(selectedView).some(y=>y.id===id))selectedView=x.folderId||'all';app.classList.add('editing');render();if(innerWidth>720)$('#titleField').focus()}
function updateSelected(field,value){const x=selected();if(!x)return;x[field]=value;x.updatedAt=now();scheduleSave();renderFolders();renderList();renderRelated()}
function renderRelated(){const x=selected();if(!x)return;const related=doc.items.filter(y=>y.id!==x.id&&y.tags.some(t=>x.tags.includes(t))).map(y=>({y,score:y.tags.filter(t=>x.tags.includes(t)).length})).sort((a,b)=>b.score-a.score||b.y.updatedAt-a.y.updatedAt).slice(0,8);$('#related').hidden=!related.length;$('#relatedList').innerHTML=related.map(({y,score})=>'<button data-id="'+esc(y.id)+'">'+esc(y.title||'제목 없음')+' <span class="type">'+score+'개 태그</span></button>').join('');$('#relatedList').querySelectorAll('button').forEach(b=>b.onclick=()=>openItem(b.dataset.id))}
function renderTagPicker(){
  const x=selected();if(!x)return;
  const chosen=$('#chosenTags'),field=$('#tagsField'),menu=$('#tagSuggestions');
  chosen.innerHTML=x.tags.map(t=>'<span class="chosen-tag">#'+esc(t)+' <button type="button" data-tag="'+esc(t)+'" aria-label="'+esc(t)+' 태그 제거">×</button></span>').join('');
  chosen.querySelectorAll('button').forEach(b=>b.onclick=()=>removeTag(b.dataset.tag));
  const needle=field.value.trim().replace(/^#/,'').toLocaleLowerCase('ko');
  const available=allTags().filter(([t])=>!x.tags.includes(t)&&(!needle||t.toLocaleLowerCase('ko').includes(needle))).slice(0,12);
  const exact=allTags().some(([t])=>t.toLocaleLowerCase('ko')===needle);
  let html='';
  if(needle&&!exact)html+='<button type="button" class="create-tag" data-value="'+esc(field.value.trim())+'"><span>＋ #'+esc(field.value.trim().replace(/^#/,''))+' 만들기</span></button>';
  html+=available.map(([t,n])=>'<button type="button" data-value="'+esc(t)+'"><span>#'+esc(t)+'</span><span class="tag-count">'+n+'개 쟁점</span></button>').join('');
  menu.innerHTML=html;menu.hidden=!tagPickerOpen||!html;
  menu.querySelectorAll('button').forEach(b=>b.onmousedown=e=>{e.preventDefault();addTag(b.dataset.value)});
}
function addTag(value){
  const x=selected(),tag=cleanTags([value])[0];if(!x||!tag)return;
  if(!x.tags.some(t=>t.toLocaleLowerCase('ko')===tag.toLocaleLowerCase('ko')))x.tags.push(tag);
  $('#tagsField').value='';tagPickerOpen=true;updateSelected('tags',x.tags);renderTagPicker();$('#tagsField').focus();
}
function removeTag(tag){const x=selected();if(!x)return;updateSelected('tags',x.tags.filter(t=>t!==tag));renderTagPicker()}
function renderBodyHighlights(){
  const x=selected(),field=$('#bodyField'),layer=$('#bodyHighlights');if(!x)return;
  refreshKeywordData(x);let at=0,html='';for(const range of x.keywordRanges){html+=esc(x.body.slice(at,range.start))+'<mark>'+esc(x.body.slice(range.start,range.end))+'</mark>';at=range.end}html+=esc(x.body.slice(at));if(x.body.endsWith('\n'))html+=' ';
  layer.innerHTML=html;syncBodyHighlightLayer();
}
function syncBodyHighlightLayer(){const field=$('#bodyField'),layer=$('#bodyHighlights');layer.scrollTop=field.scrollTop;layer.scrollLeft=field.scrollLeft;layer.style.width=field.clientWidth+'px';layer.style.height=field.clientHeight+'px'}
function transformKeywordRanges(ranges,start,oldEnd,newEnd){
  const delta=newEnd-oldEnd,out=[];for(const r of ranges){if(r.end<=start)out.push({start:r.start,end:r.end});else if(r.start>=oldEnd)out.push({start:r.start+delta,end:r.end+delta});else{if(r.start<start)out.push({start:r.start,end:start});if(r.end>oldEnd)out.push({start:newEnd,end:r.end+delta})}}return out;
}
function updateBody(value){
  const x=selected();if(!x)return;const old=x.body,next=String(value);let start=0;while(start<old.length&&start<next.length&&old[start]===next[start])start++;let suffix=0;while(suffix<old.length-start&&suffix<next.length-start&&old[old.length-1-suffix]===next[next.length-1-suffix])suffix++;
  const oldEnd=old.length-suffix,newEnd=next.length-suffix;x.keywordRanges=transformKeywordRanges(x.keywordRanges,start,oldEnd,newEnd);x.body=next;refreshKeywordData(x);x.updatedAt=now();scheduleSave();renderBodyHighlights();renderList();
}
function selectionIsHighlighted(ranges,start,end){let covered=start;for(const r of ranges){if(r.end<=covered)continue;if(r.start>covered||r.start>=end)return false;covered=Math.max(covered,r.end);if(covered>=end)return true}return false}
function toggleSelectedHighlight(){
  const x=selected(),field=$('#bodyField');if(!x)return false;const start=field.selectionStart,end=field.selectionEnd;if(start===end){toast('본문에서 단어나 구문을 먼저 선택하세요');field.focus();return false}
  if(selectionIsHighlighted(x.keywordRanges,start,end)){
    const next=[];for(const r of x.keywordRanges){if(r.end<=start||r.start>=end)next.push(r);else{if(r.start<start)next.push({start:r.start,end:start});if(r.end>end)next.push({start:end,end:r.end})}}x.keywordRanges=next;toast('선택한 부분의 형광펜을 지웠습니다');
  }else{x.keywordRanges.push({start,end});toast('선택한 부분을 키워드로 표시했습니다')}
  refreshKeywordData(x);x.updatedAt=now();scheduleSave();renderBodyHighlights();renderList();field.focus({preventScroll:true});field.setSelectionRange(start,end);return true;
}

$('#sidebarFolderPicker').onclick=e=>e.stopPropagation();

const dlg=$('#syncDlg'),syncMsg=$('#syncMsg');
$('#syncBtn').onclick=()=>{$('#tokenIn').value=cfg.token||'';$('#gistIn').value=cfg.gistId||'';syncMsg.textContent='';dlg.showModal()};
$('#closeSync').onclick=()=>dlg.close();
$('#tokenIn').onchange=e=>{cfg.token=e.target.value.trim();saveCfg()};
$('#gistIn').onchange=e=>{cfg.gistId=e.target.value.trim();saveCfg()};
async function pushGist(){
  cfg.token=$('#tokenIn').value.trim();cfg.gistId=$('#gistIn').value.trim();saveCfg();
  if(!cfg.token){syncMsg.textContent='업로드에는 GitHub 토큰이 필요합니다.';return}
  syncMsg.textContent='업로드 중…';
  try{
    if(saveTimer)saveNow();
    const body={description:'법학 쟁점노트 데이터',files:{}};body.files[GIST_FILE]={content:JSON.stringify(doc)};
    let url='https://api.github.com/gists',method='POST';if(cfg.gistId){url+='/'+cfg.gistId;method='PATCH'}else body.public=false;
    const r=await fetch(url,{method,headers:{Authorization:'Bearer '+cfg.token,Accept:'application/vnd.github+json'},body:JSON.stringify(body)});if(!r.ok)throw new Error(r.status);
    const j=await r.json();cfg.gistId=j.id;saveCfg();$('#gistIn').value=j.id;syncMsg.textContent='업로드 완료';
  }catch(e){syncMsg.textContent='업로드 실패 ('+e.message+')'}
}
async function pullGist(){
  cfg.token=$('#tokenIn').value.trim();cfg.gistId=$('#gistIn').value.trim();saveCfg();
  if(!cfg.gistId){syncMsg.textContent='Gist ID를 입력하세요.';return}
  syncMsg.textContent='가져오는 중…';
  try{
    const headers={Accept:'application/vnd.github+json'};if(cfg.token)headers.Authorization='Bearer '+cfg.token;
    const r=await fetch('https://api.github.com/gists/'+cfg.gistId,{headers});if(!r.ok)throw new Error(r.status);const j=await r.json();const f=j.files&&j.files[GIST_FILE];if(!f)throw new Error('데이터 없음');
    const content=f.truncated?await(await fetch(f.raw_url)).text():f.content;const next=parseDoc(content);
    if(!confirm(next.items.length+'개 항목으로 현재 목록을 교체할까요?')){syncMsg.textContent='취소됨';return}
    doc=next;selectedId=null;saveNow();render();syncMsg.textContent='가져오기 완료';setTimeout(()=>dlg.close(),450);
  }catch(e){syncMsg.textContent='가져오기 실패 ('+e.message+')'}
}
$('#pushBtn').onclick=pushGist;$('#pullBtn').onclick=pullGist;
let toastTimer;function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1800)}
render();
</script>
</body>
</html>
